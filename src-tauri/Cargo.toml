[package]
name = "ymux"
version = "0.12.0"
description = "A lightweight tmux-inspired terminal multiplexer for Windows and macOS"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ymux_lib"
path = "src/lib.rs"

[[bin]]
name = "ymux"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
portable-pty = "0.8"
anyhow = "1"
thiserror = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.33"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Shared theme palette (theme.toml); ymux exposes load/save to the settings
# UI, and the editor pane takes its syntax colours from it.
ytheme = { path = "../crates/ytheme" }
# Comparison keys for paths that arrive from different producers (OSC 7,
# `git worktree list`, the config file). Deliberately not behind `desktop`:
# `pty/osc7.rs` and `git/mod.rs` both use it and both are covered by
# `cargo test --no-default-features --lib -p ymux` on Linux CI.
ypath = { path = "../crates/ypath" }
# Cross-platform "open file/folder with the OS default app" used by the
# Config Files settings section.
# `reveal` (show-in-file-manager) is used by the terminal path linkifier for
# executables and scripts, which "open with the default program" would run.
opener = { version = "0.7", features = ["reveal"] }

# PNG encoding for clipboard images. Pure Rust and deliberately NOT behind
# `desktop`: the encode half of the clipboard-image path (`paste_images::
# encode_png_rgba`) is the part worth unit-testing, and those tests have to
# run under `cargo test --no-default-features --lib -p ymux` on Linux CI.
# Already in the dependency graph via Tauri's icon handling, so this costs
# nothing in build time.
png = "0.17"

# Content hashing for `textfile::ContentStamp`, the guard that stops the
# editor pane silently overwriting a file an agent rewrote underneath it.
# Pure Rust and already in the dependency graph via Tauri, and deliberately
# NOT behind `desktop` for the same reason as `png`: the stamp logic is what
# is worth unit-testing and those tests run on Linux CI.
sha2 = "0.10"

# Tauri runtime is gated behind the `desktop` feature, which is on by default
# so that `pnpm tauri dev` / `pnpm tauri build` work out of the box on the
# Windows target machines this app is built for. Linux dev hosts that only
# want to run the cross-platform unit tests can opt out with
# `--no-default-features --lib --tests` to avoid pulling in the GTK/webkit2gtk
# system libraries the Tauri crate needs on Linux.
# SAFETY: Window::add_child is gated on the "unstable" feature; pinned to
# =2.10.3 because the API may change in any 2.x minor without semver protection.
tauri = { version = "=2.10.3", optional = true, features = ["unstable", "devtools", "tray-icon"] }

# Update checker: polls the GitHub releases API in a background thread. Kept
# behind the `desktop` feature because the cross-platform test suite doesn't
# need it, and rustls keeps the binary footprint minimal vs. openssl.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"], optional = true }

# URL parsing for native webview navigation, and for the IPC origin check
# that gates the filesystem/git command surface. Already in the dependency
# tree via Tauri, and pure Rust with no system deps, so deliberately NOT
# behind `desktop`: `fspath::origin_is_local` is the security decision on
# that surface and has to be unit-testable under
# `cargo test --no-default-features --lib -p ymux` on Linux CI, for the same
# reason `ypath` and `png` are unconditional.
url = "2"

# OS desktop notifications, exposed to the frontend via the `notify` command.
# Desktop-only because it wraps a native Tauri plugin.
tauri-plugin-notification = { version = "2", optional = true }

# Relaunching ymux while it sits hidden in the tray (Start menu, taskbar pin,
# `open -n`) hands off to the running instance and exits. Only registered in
# release builds (see main.rs): the plugin keys on the bundle identifier,
# which `tauri dev` shares with the installed app. The `semver` feature stays
# off on purpose, so two ymux versions never both run (and race for the hook
# port, CLAUDE.md rule 13). Behind `desktop`: on Linux it pulls zbus.
tauri-plugin-single-instance = { version = "2.4", optional = true }

# System-clipboard access, used to read a pasted screenshot as raw pixels.
# `image-data` is the feature that exposes `get_image`; on Windows and macOS it
# is backed by native APIs (the `image` crate it names is a target-specific
# dependency of unix-non-mac only, so it never compiles for our two targets).
# Behind `desktop` because on Linux it would drag in x11rb — exactly what the
# `--no-default-features` test build exists to avoid. `wayland-data-control` is
# deliberately left off: ymux ships on Windows and macOS only.
arboard = { version = "3.6.1", default-features = false, features = ["image-data"], optional = true }

# Move-to-trash for the files pane's delete. The retired `ydir` TUI deleted with
# `remove_dir_all` and no confirmation; the GUI default is trash + a confirm
# dialog, with permanent delete on Shift+Delete. Desktop-only: on Linux it
# would pull the freedesktop/DBus stack that `--no-default-features` exists
# to avoid, and ymux ships on Windows and macOS.
trash = { version = "5.2", optional = true }

[dev-dependencies]
# Real-filesystem round-trips for `fsops`. The semantics worth pinning
# (rename silently overwriting, a directory symlink needing `remove_dir`)
# are per-platform, so these only build in the desktop configuration.
tempfile = "3"
# `ipc_guard`'s enforcement test parses `main.rs` and every command body, so
# a comment cannot pass for a guard. Already in the lock via Tauri's macros.
syn = { version = "2", features = ["full", "parsing", "printing"] }
quote = "1"
proc-macro2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_System_Threading",
    # ReplaceFileW / SetFileAttributesW: the editor's atomic save keeps a
    # file's ACLs and hidden/system attributes (fsops::imp::write_text).
    "Win32_Storage_FileSystem",
    # setsockopt(SO_EXCLUSIVEADDRUSE) for the hook receiver (hook_http).
    "Win32_Networking_WinSock",
] }
# Creates the hook receiver's socket so SO_EXCLUSIVEADDRUSE can be set before
# bind. Already in the lock via reqwest/tokio; Windows-only because Unix
# needs no extra socket option.
socket2 = "0.6"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:reqwest", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance", "dep:arboard", "dep:trash"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
