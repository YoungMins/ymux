name: release

# Build the installers and publish them to GitHub Releases.
#
# Triggers:
#   - Pushing a tag matching `v*` (e.g. `v0.1.0`) — the normal release path.
#   - Manual `workflow_dispatch` from the Actions UI for ad-hoc test builds.
#
# Job order is deliberate:
#   test-linux    fast pure-logic gate, fails a bad commit before any slow
#                 platform build spins up.
#   build-windows builds the MSI *and* creates the GitHub release. Running it
#                 first means exactly one job ever creates the release, which
#                 avoids the duplicate-release race two parallel tauri-action
#                 jobs would hit.
#   build-macos   builds the arm64 .app/.dmg and uploads it onto the release
#                 build-windows already created.
#   finalize      rewrites the release body once both artifacts are in place.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for the release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0-test'
      draft:
        description: 'Publish as a draft release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  test-linux:
    name: Test (linux, lib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace)
        run: cargo fmt --all --check

      - name: cargo clippy (workspace, no tauri deps)
        run: cargo clippy -p ytheme -p yipc -p ymon -p ydir -p ycode -p ylauncher -- -D warnings

      - name: cargo clippy (ymux lib, no tauri runtime)
        run: cargo clippy --no-default-features --lib --tests -p ymux -- -D warnings

      - name: cargo test (tools + shared crates)
        run: cargo test -p ytheme -p yipc -p ymon -p ydir -p ycode -p ylauncher

      - name: cargo test (ymux lib, no tauri runtime)
        run: cargo test --no-default-features --lib -p ymux

      # Install the Tauri 2 system dependencies on Linux so we can `cargo
      # check` the `ymux` binary with `--features desktop` enabled. This
      # catches command-handler / generate_handler! regressions on a fast
      # Linux runner before the slower windows-latest job ever spins up.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            pkg-config

      - name: Create dummy sidecar binaries for cargo check
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          for tool in ymon ydir ycode y ygit; do
            touch "src-tauri/binaries/${tool}-${TRIPLE}"
          done

      - name: cargo check --bin (with desktop feature)
        run: cargo check --features desktop --bin ymux -p ymux

  build-windows:
    name: Build (windows, tauri)
    needs: test-linux
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & release with tauri-action
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: 'ymux ${{ steps.meta.outputs.tag }}'
          # Minimal placeholder — the `Rewrite release body…` step below
          # replaces this with install info + GitHub's auto-generated
          # notes (PRs & commits since the previous tag).
          releaseBody: 'ymux ${{ steps.meta.outputs.tag }} — build in progress. Release notes are being generated…'
          releaseDraft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: false

      # Also attach the MSI as a workflow artifact. The release only exists on
      # a tag push, so without this a `workflow_dispatch` test build produces
      # nothing downloadable — and artifacts are how you inspect a build that
      # you do not want to cut a release for.
      - name: Upload MSI as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ymux-windows-x64-msi
          # Glob both locations: the bundle lands under the workspace root
          # `target/`, but pin the `src-tauri/` path too so a future change to
          # the cargo target dir does not silently upload nothing.
          path: |
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build (macOS arm64, tauri)
    # Sequential after build-windows on purpose: that job is the one that
    # creates the GitHub release, and this job uploads onto it. Running both
    # in parallel would race two tauri-action jobs to create the same release.
    needs: build-windows
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The macOS-only tests are the ones that matter here: they spawn a real
      # PTY through the detected zsh/bash profiles and assert the OSC 7 shell
      # integration reports a live cwd. The Linux gate cannot compile, let
      # alone run, those.
      - name: cargo test (ymux lib, macOS)
        run: cargo test --no-default-features --lib -p ymux

      # Tauri decides *whether* to sign with a certificate by checking that
      # APPLE_CERTIFICATE is present, not that it holds anything. A missing
      # GitHub secret interpolates to the empty string — which is still
      # present — so declaring these inline on the build step makes the
      # bundler try to import an empty certificate and die with
      # "failed to run command security import". Hence this step: export the
      # Apple variables only when they actually carry a value.
      - name: Configure Apple code signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Heredoc form so a multi-line base64 certificate survives intact.
          put() {
            printf '%s<<YMUX_ENV_EOF\n%s\nYMUX_ENV_EOF\n' "$1" "$2" >> "$GITHUB_ENV"
          }

          if [ -n "$CERT" ] && [ -n "$CERT_PASSWORD" ]; then
            put APPLE_CERTIFICATE "$CERT"
            put APPLE_CERTIFICATE_PASSWORD "$CERT_PASSWORD"
            if [ -n "$IDENTITY" ]; then
              put APPLE_SIGNING_IDENTITY "$IDENTITY"
            else
              echo "APPLE_CERTIFICATE is set but APPLE_SIGNING_IDENTITY is not" >&2
              exit 1
            fi
            echo "Signing with a Developer ID certificate."
          else
            # Ad-hoc. arm64 macOS refuses to launch a wholly unsigned binary,
            # and "-" satisfies that. It does NOT satisfy Gatekeeper for a
            # downloaded file — the release notes carry the xattr workaround.
            put APPLE_SIGNING_IDENTITY "-"
            echo "No certificate secret set — signing ad-hoc, not notarized."
          fi

          # Tauri only notarizes when the full trio is present, and the same
          # present-but-empty trap applies, so gate it the same way.
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            put APPLE_ID "$NOTARY_APPLE_ID"
            put APPLE_PASSWORD "$NOTARY_PASSWORD"
            put APPLE_TEAM_ID "$NOTARY_TEAM_ID"
            echo "Notarization credentials present."
          else
            echo "Notarization credentials absent — skipping notarization."
          fi

      - name: Build .app + .dmg
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          # Keeps `scripts/build-tools.mjs` (which stages the sidecar binaries
          # under a triple-suffixed name) in lockstep with the `--target` below.
          # The Apple signing vars come from the step above, via $GITHUB_ENV.
          YMUX_TARGET_TRIPLE: aarch64-apple-darwin
        with:
          # No tagName/releaseId: this step only builds. Uploading is done
          # below so the artifact can be renamed to carry its architecture.
          args: --target aarch64-apple-darwin

      - name: Upload DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ymux-macos-aarch64-dmg
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      # Tauri names the DMG `ymux_<version>_aarch64.dmg`, which is already
      # unambiguous, but the release also carries an `x64` MSI — spelling the
      # platform out keeps the two obvious side by side on the release page.
      - name: Upload DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
          REPO: ${{ github.repository }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          # Take the path from tauri-action rather than guessing it: this is a
          # cargo workspace, so the bundle lands under the *root* `target/`,
          # not `src-tauri/target/`.
          # `|| true` so a miss falls through to the explicit error below
          # instead of `set -e` killing the step with no explanation.
          DMG=$(printf '%s' "$ARTIFACTS" | node -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
            const dmg = j.find((p) => p.endsWith(".dmg"));
            process.stdout.write(dmg || "");
          ' || true)
          if [ -z "$DMG" ] || [ ! -f "$DMG" ]; then
            echo "no .dmg produced by the bundler (artifacts: $ARTIFACTS)" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          DEST="ymux_${VERSION}_macos_aarch64.dmg"
          cp "$DMG" "$DEST"
          gh release upload "$TAG" "$DEST" --repo "$REPO" --clobber

  finalize:
    name: Finalize release notes
    # Runs once both installers are attached. `always()` plus an explicit
    # success check on the Windows job means a macOS failure still leaves a
    # properly described Windows release rather than the placeholder text.
    needs: [build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace the placeholder body with install instructions plus the
      # GitHub "Generate release notes" output (groups merged PRs and
      # commits since the previous tag). If the API call fails — e.g. the
      # very first release where there is no previous tag — we fall back
      # to just the install section so the release is never left with
      # the placeholder text.
      - name: Rewrite release body with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
          REPO: ${{ github.repository }}
          MAC_RESULT: ${{ needs.build-macos.result }}
        run: |
          set -euo pipefail

          AUTO=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body 2>/dev/null || echo "")

          {
            echo "ymux ${TAG}"
            echo ""
            echo "## Install"
            echo ""
            echo "### Windows"
            echo ""
            echo "Download \`ymux_*_x64_en-US.msi\` below and run it."
            echo "The installer bundles a WebView2 bootstrapper, so Windows 10"
            echo "machines without the runtime will install it on first launch."
            if [ "$MAC_RESULT" = "success" ]; then
              echo ""
              echo "### macOS (Apple Silicon)"
              echo ""
              echo "Download \`ymux_*_macos_aarch64.dmg\` below, open it, and drag"
              echo "ymux to Applications."
              echo ""
              echo "The app is **not notarized**, so Gatekeeper will refuse to open it"
              echo "on first launch. Clear the download quarantine flag once:"
              echo ""
              echo '```sh'
              echo "xattr -dr com.apple.quarantine /Applications/ymux.app"
              echo '```'
              echo ""
              echo "Requires macOS 11 or newer on an Apple Silicon Mac."
            fi
            if [ -n "$AUTO" ]; then
              echo ""
              echo "$AUTO"
            fi
            echo ""
            echo "See the [README](https://github.com/${REPO}#readme) for keybindings and usage."
          } > release-notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
