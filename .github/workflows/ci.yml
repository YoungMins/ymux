name: ci

# Fast feedback on every push to main and every pull request. The release
# workflow (release.yml) still gates tagged builds on its own test job.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt (workspace)
        run: cargo fmt --all --check

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: vitest (frontend)
        run: npx vitest run

      - name: cargo clippy (shared crates, no tauri deps)
        run: cargo clippy -p ytheme -p ypath -- -D warnings

      - name: cargo clippy (ymux lib, no tauri runtime)
        run: cargo clippy --no-default-features --lib --tests -p ymux -- -D warnings

      - name: cargo test (shared crates)
        run: cargo test -p ytheme -p ypath

      # `shell::detect`'s real-zsh shim test skips itself without zsh, and
      # ubuntu-latest doesn't ship it.
      - name: Install zsh (real-shell shim test)
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # Never `--workspace` on Linux: it pulls GTK (see CLAUDE.md).
      - name: cargo test (ymux lib, no tauri runtime)
        run: cargo test --no-default-features --lib -p ymux

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (shared crates)
        run: cargo test -p ytheme -p ypath

      - name: cargo test (ymux lib, no tauri runtime)
        run: cargo test --no-default-features --lib -p ymux
