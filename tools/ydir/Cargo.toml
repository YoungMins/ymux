[package]
name = "ydir"
version = "0.1.0"
edition = "2021"
description = "mdir/Midnight Commander-style dual-pane file manager TUI"

[[bin]]
name = "ydir"
path = "src/main.rs"

[dependencies]
ytheme = { path = "../../crates/ytheme" }
yversion = { path = "../../crates/yversion" }
yipc = { path = "../../crates/yipc" }
# The dock sends a cwd the shell spelled; the panel holds one this process
# built. `same_dir` needs them comparable without a disk round-trip.
ypath = { path = "../../crates/ypath" }
ratatui = "0.29"
# Column alignment and truncation count terminal cells, not chars: a Hangul
# syllable is one char but two cells. Already in the tree via ratatui.
unicode-width = "0.2"
crossterm = "0.28"
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
